# Render Blueprint — DEMO topology (NestJS backend + prebuilt Next.js image)
#
# Scope: public demo of the b3-erp (MACBIS) frontend, which for the demo talks
# ONLY to the NestJS domain backend. The Django platform backend and the Celery
# worker are intentionally NOT deployed here (worker isn't offered on free; the
# demo pages don't need the platform API). Postgres is external (Neon).
#
# Cost: frontend on Starter ($7/mo, always-on — no cold start); backend on free.
# The free backend still sleeps after ~15min idle, so pre-warm it before demos:
#   https://b3-erp-backend.onrender.com/api/v1/health
#
# The frontend is NOT built on Render: its build needs ~7GB RAM (measured), far
# above any affordable Render tier. Instead GitHub Actions builds a Docker image
# (.github/workflows/frontend-image.yml) and pushes it to GHCR; Render just runs
# that prebuilt image below. Runtime is light (all routes are dynamic/SSR), so
# Starter (512MB) is plenty.

services:
  # b3-erp Domain Services (NestJS) — the only backend the demo needs
  - type: web
    name: b3-erp-backend
    runtime: node
    plan: free
    rootDir: b3-erp/backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      # TypeORM uses DATABASE_URL directly (ssl: rejectUnauthorized=false → Neon OK)
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_WgKoApGEJR54@ep-sweet-recipe-ailz1ddp.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_SYNCHRONIZE
        value: "false"
      # No REDIS_URL on purpose: cache.config falls back to in-memory when it's
      # absent. Bull will log localhost:6379 connection retries (queues are
      # non-critical for the demo); HTTP/page serving is unaffected.
      - key: JWT_SECRET
        generateValue: true
      # Prod CORS is pinned to this exact origin with credentials:true — a
      # mismatch blocks every browser call. Points at the frontend service below.
      - key: FRONTEND_URL
        value: https://b3-erp-frontend.onrender.com

  # Frontend (Next.js) — the demo UI, deployed as a prebuilt image from GHCR.
  - type: web
    name: b3-erp-frontend
    runtime: image
    plan: starter
    image:
      url: ghcr.io/kreupai-technologies/optiforge-frontend:latest
      # If the GHCR package is kept PRIVATE, create a Render registry credential
      # (Dashboard → Settings → Registry Credentials, GitHub PAT w/ read:packages)
      # and reference it here; delete these lines if the package is public.
      # creds:
      #   fromRegistryCreds:
      #     name: ghcr-optiforge
    envVars:
      - key: NODE_ENV
        value: production
      # NEXT_PUBLIC_* are baked into the client bundle at BUILD time (CI); these
      # runtime copies only affect server-side (SSR) fetches. Keep them aligned.
      - key: NEXT_PUBLIC_API_URL
        value: https://b3-erp-backend.onrender.com/api/v1
      - key: NEXT_PUBLIC_DOMAIN_API_URL
        value: https://b3-erp-backend.onrender.com/api/v1
