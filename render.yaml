# Render Blueprint Specification for ManufacturingOS
# Dual-backend architecture: Django Platform + NestJS Domain Services + Next.js Frontend
# Uses existing Render Free Tier Postgres DB and Redis instance via sync: false environment variables

services:
  # OptiForge Platform Backend (Django)
  - type: web
    name: optiforge-platform
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn optiforge.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: optiforge.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true

  # OptiForge Platform Celery Worker
  - type: worker
    name: optiforge-celery-worker
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A optiforge worker --loglevel=info
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: optiforge.settings
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: optiforge-platform
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromService:
          type: web
          name: optiforge-platform
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: web
          name: optiforge-platform
          envVarKey: REDIS_URL
      - key: JWT_SECRET
        fromService:
          type: web
          name: optiforge-platform
          envVarKey: JWT_SECRET

  # b3-erp Domain Services (NestJS)
  - type: web
    name: b3-erp-backend
    env: node
    plan: free
    rootDir: b3-erp/backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: optiforge-platform
          envVarKey: DATABASE_URL
      - key: DATABASE_SCHEMA
        value: b3_erp
      - key: JWT_SECRET
        fromService:
          type: web
          name: optiforge-platform
          envVarKey: JWT_SECRET
      - key: REDIS_URL
        fromService:
          type: web
          name: optiforge-platform
          envVarKey: REDIS_URL

  # Frontend (Next.js)
  - type: web
    name: b3-erp-frontend
    env: node
    plan: free
    rootDir: b3-erp/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=8192"
      - key: NEXT_PUBLIC_PLATFORM_API_URL
        value: https://optiforge-platform.onrender.com/api/v1
      - key: NEXT_PUBLIC_DOMAIN_API_URL
        value: https://b3-erp-backend.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://optiforge-platform.onrender.com/api/v1
