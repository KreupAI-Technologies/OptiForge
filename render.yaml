# Render Blueprint — DEMO topology (NestJS-only, free tier)
#
# Scope: public demo of the b3-erp (MACBIS) frontend, which for the demo talks
# ONLY to the NestJS domain backend. The Django platform backend and the Celery
# worker are intentionally NOT deployed here (worker isn't offered on free; the
# demo pages don't need the platform API). Postgres is external (Neon).
#
# Frontend (Next.js, 1,719 pages) is deployed on Vercel, NOT here — a build that
# large reliably OOMs on Render's 512MB free build. See docs / chat for steps.
#
# Cost: $0. Free web services sleep after ~15min idle (~50s cold start on the
# next hit) — pre-warm https://b3-erp-backend.onrender.com/api/v1/health before demos.

services:
  # b3-erp Domain Services (NestJS) — the only backend the demo needs
  - type: web
    name: b3-erp-backend
    runtime: node
    plan: free
    rootDir: b3-erp/backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=460"
      # TypeORM uses DATABASE_URL directly (ssl: rejectUnauthorized=false → Neon OK)
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_WgKoApGEJR54@ep-sweet-recipe-ailz1ddp.c-4.us-east-1.aws.neon.tech/neondb?sslmode=require
      - key: DB_SYNCHRONIZE
        value: "false"
      # No REDIS_URL on purpose: cache.config falls back to in-memory when it's
      # absent. Bull will log localhost:6379 connection retries (queues are
      # non-critical for the demo); HTTP/page serving is unaffected.
      - key: JWT_SECRET
        generateValue: true
      # MUST equal the exact Vercel frontend origin (no trailing slash). In prod
      # CORS is pinned to this value with credentials:true — a mismatch blocks
      # every browser call. Update after Vercel gives you the URL, then redeploy.
      - key: FRONTEND_URL
        value: https://REPLACE-WITH-YOUR-VERCEL-URL.vercel.app
